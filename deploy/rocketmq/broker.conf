# 本地 compose Broker。Proxy 在同一网络内通过服务名访问，不走宿主机端口。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
brokerIP1 = rocketmq-broker
listenPort = 10911
autoCreateTopicEnable = true
storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog
storePathConsumerOffset = /home/rocketmq/store/config/consumerOffset.json
storePathDelayOffset = /home/rocketmq/store/config/delayOffset.json
msgTraceTopicName = RMQ_SYS_TRACE_TOPIC
traceTopicEnable = false
