# 本地开发与集成验证环境：MySQL、Redis、RocketMQ、通知服务与模拟供应商。
# 镜像标签与 RocketMQ 5.3.1 Proxy + Go 客户端 v5.1.4 的组合见 TECH_DESIGN.md 第 2 节。

services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: notifier
      MYSQL_USER: notifier
      MYSQL_PASSWORD: notifier
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.12-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    # 命名卷默认属主是 root，镜像用户 rocketmq(3000) 无法写 store/lock。
    user: "0:0"
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /opt/rocketmq/broker.conf
    depends_on:
      - rocketmq-namesrv
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    volumes:
      - rocketmq-store:/home/rocketmq/store
      - ./deploy/rocketmq/broker.conf:/opt/rocketmq/broker.conf:ro
    ports:
      - "10909:10909"
      - "10911:10911"
    restart: on-failure

  rocketmq-proxy:
    image: apache/rocketmq:5.3.1
    command: sh mqproxy -n rocketmq-namesrv:9876
    depends_on:
      - rocketmq-broker
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    ports:
      - "8081:8081"
    restart: on-failure

  notifier:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      MYSQL_DSN: "notifier:notifier@tcp(mysql:3306)/notifier?parseTime=true&charset=utf8mb4"
      REDIS_ADDR: "redis:6379"
      ROCKETMQ_ENDPOINT: "rocketmq-proxy:8081"
      AUTH_CONFIG_REF: "/config/identities.example.json"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  mockvendor:
    # 进程只监听容器内 127.0.0.1，宿主机端口映射到不了。集成验证走 `make mockvendor`。
    build:
      context: .
      dockerfile: cmd/mockvendor/Dockerfile
    environment:
      MOCKVENDOR_ADDR: "127.0.0.1:9090"
      MOCKVENDOR_STATE_PATH: "/tmp/mockvendor-state.json"

volumes:
  mysql-data:
  redis-data:
  rocketmq-store:
